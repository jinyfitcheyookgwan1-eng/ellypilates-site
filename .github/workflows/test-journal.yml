name: Test ELLY journal generator
on:
  pull_request:
    paths:
      - 'scripts/build_journal_pages.py'
      - 'tests/test_journal.py'
      - '.github/workflows/test-journal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile journal script
        run: python -m py_compile scripts/build_journal_pages.py
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -p 'test_journal.py' -v
