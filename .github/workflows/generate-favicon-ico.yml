name: Generate root favicon ICO
on:
  push:
    paths:
      - '.github/workflows/generate-favicon-ico.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert existing favicon PNG to ICO
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          img = Image.open('favicon.png').convert('RGBA')
          img.save('favicon.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          PY
      - name: Commit root favicon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favicon.ico
          if ! git diff --cached --quiet; then
            git commit -m "fix: add root favicon.ico based on existing brand icon"
            git push
          fi
